name: CI

on:
  push:
    branches: [ 'master', 'release-0-8', 'release-0-9', 'release-0-10' ]
  pull_request:
    branches: ['**']

jobs:
  tests:
    # 22.04: setup-ruby has no Ruby 2.6/2.7 builds for 24.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.6', rails: 5.1.7 }
          - { ruby: '2.6', rails: 5.2.8.1 }
          - { ruby: '2.6', rails: 6.0.6.1 }
          - { ruby: '2.6', rails: 6.1.7.10 }
          - { ruby: '2.7', rails: 5.2.8.1 }
          - { ruby: '2.7', rails: 6.1.7.10 }
          - { ruby: '2.7', rails: 7.0.10 }
          - { ruby: '3.2', rails: 6.1.7.10 }
          - { ruby: '3.2', rails: 7.0.10 }
          - { ruby: '3.2', rails: 7.1.6 }
          - { ruby: '3.2', rails: 7.2.4 }
          - { ruby: '3.2', rails: 8.0.5.2 }
          - { ruby: '3.2', rails: 8.1.4.1 }
          - { ruby: '3.4', rails: 7.0.10 }
          - { ruby: '3.4', rails: 7.1.6 }
          - { ruby: '3.4', rails: 7.2.4 }
          - { ruby: '3.4', rails: 8.0.5.2 }
          - { ruby: '3.4', rails: 8.1.4.1 }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    name: Ruby ${{ matrix.ruby }} Rails ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Run tests
        run: bundle exec rake test
